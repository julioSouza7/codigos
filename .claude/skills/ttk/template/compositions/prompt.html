<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #pm-bg { position: absolute; left: 260px; top: 330px; width: 1400px; height: 500px; background: rgba(9,11,10,0.9); opacity: 0; }
    .pm-lab { position: absolute; top: 350px; font-family: var(--font-mono); font-weight: 700; font-size: 22px; letter-spacing: 0.12em; opacity: 0; }
    #pm-l1 { left: 300px; color: #1ed760; } #pm-l2 { right: 300px; color: rgba(225,232,228,0.6); }
    #pm-txt { position: absolute; left: 310px; top: 420px; width: 1320px; font-family: var(--font-mono); font-weight: 500; font-size: 46px;
      line-height: 74px; color: #f1f3f2; white-space: pre; }
    #pm-txt span { opacity: 0; }
    #pm-txt .hl { background: #1ed760; color: #04140a; box-shadow: 0 0 18px rgba(30,215,96,0.55); }
    #pm-prog { position: absolute; left: 310px; top: 760px; width: 1300px; height: 6px; border-radius: 6px; background: #1d211f; opacity: 0; }

  </style>
  <div id="root" data-composition-id="prompt" data-width="1080" data-height="1920">
    <div class="tk-scr" data-layout-ignore>
      <div id="pm-bg"></div>
      <div id="pm-box" class="tk-full"></div>
      <div id="pm-l1" class="pm-lab">• PROMPT</div>
      <div id="pm-l2" class="pm-lab">→ CLAUDE</div>
      <div id="pm-txt"></div>
      <div id="pm-prog"><div id="pm-fill"></div></div>
      <div id="pm-st">renderizando anuncio_spotify.mp4 · 1080×1920 · 60 fps</div>
      <div id="pm-fx" class="tk-full"></div>
    </div>
  </div>
  <script>
    (function () {
      var box = document.getElementById("pm-box"), fx = document.getElementById("pm-fx"), txt = document.getElementById("pm-txt");
      var lines = ["a linha verde corta as palavras, o logo do", "Spotify pulsa e a câmera atravessa o O."];
      var hl = [[2, 13], [14, 19], [35, 50], [61, 77]]; // [start,end) indexes over the joined text (with '\n')
      var full = lines.join("\n"), spans = [], pos = [], idx = [];
      var row = 0, col = 0, CW = 27.6, LH = 74;
      for (var i = 0; i < full.length; i++) {
        var c = full[i];
        if (c === "\n") { txt.appendChild(document.createTextNode("\n")); row++; col = 0; continue; }
        var s = document.createElement("span"); s.textContent = c; s.className = "pm-c" + i;
        hl.forEach(function (h) { if (i >= h[0] && i < h[1]) s.classList.add("hl"); });
        txt.appendChild(s); spans.push(s); idx.push(i); pos.push([310 + (col + 1) * CW, 420 + row * LH + LH / 2]); col++;
      }
      var sp = TTK.spark(fx, "pm-sp", 26);
      var tl = gsap.timeline({ paused: true });
      // the two lines from the previous shot are already the box edges; the sides draw in
      var top = TTK.drawLine(tl, box, [260, 330], [1660, 330], 0, 0.01, "none", "dim");
      var bot = TTK.drawLine(tl, box, [260, 830], [1660, 830], 0, 0.01, "none", "dim");
      TTK.drawLine(tl, box, [260, 330], [260, 830], 0.04, 0.16, "power2.out", "dim");
      TTK.drawLine(tl, box, [1660, 330], [1660, 830], 0.04, 0.16, "power2.out", "dim");
      tl.fromTo("#pm-bg", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.05);
      tl.fromTo(".pm-lab", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.18);
      // typing, with the ember as the cursor
      var T0 = 0.32, DT = 0.0145;
      tl.set(sp, { x: 310, y: 457, opacity: 1, rotation: 0 }, T0 - 0.02);
      spans.forEach(function (s, i) {
        var t = T0 + i * DT;
        tl.to(".pm-c" + idx[i], { opacity: 1, duration: 0.01 }, t);
        tl.set(sp, { x: pos[i][0], y: pos[i][1] }, t);
      });
      var tEnd = T0 + spans.length * DT;
      // done: label confirms, render bar fills during the hold
      tl.to("#pm-l2", { color: "#1ed760", duration: 0.1 }, tEnd + 0.05);
      tl.set("#pm-l2", { textContent: "✓ CLAUDE" }, tEnd + 0.05);
      tl.fromTo("#pm-prog, #pm-st", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tEnd + 0.15);
      tl.fromTo("#pm-fill", { scaleX: 0 }, { scaleX: 1, duration: 3.4 - tEnd - 0.3, ease: "power1.inOut" }, tEnd + 0.2);
      tl.fromTo("#pm-sp .tk-sp-head", { scale: 1 }, { scale: 1.35, duration: 0.4, ease: "sine.inOut", repeat: 4, yoyo: true, immediateRender: false }, tEnd);
      window.__timelines["prompt"] = tl;
    })();
  </script>
</template>

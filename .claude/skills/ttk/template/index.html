<!doctype html>
<html lang="pt-BR" data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fundo","default":"#000000"},
    {"id":"color-ink","type":"color","label":"Texto","default":"#FFFFFF"},
    {"id":"color-accent","type":"color","label":"Destaque","default":"#1ED760"},
    {"id":"font-display","type":"string","label":"Fonte de título","default":"Montserrat"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* LOOK (ttk): ground #000, ink #FFF, accent #1ED760 (Spotify green, only on black/white);
         Montserrat 900 headlines, Space Mono UI labels; neon green light lines, glitch, timeline UI, prompt typing. */
      :root {
        --color-ground: #000000; --color-ink: #ffffff; --color-accent: #1ed760;
        --font-display: "Montserrat", sans-serif; --font-mono: "Space Mono", monospace;
        --fg: var(--color-ink); --brand: var(--color-accent); --font-body: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-fps="60" data-width="1080" data-height="1920">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="glitch" data-composition-id="glitch" data-composition-src="compositions/glitch.html"
        data-start="2" data-duration="2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="timeline" data-composition-id="timeline" data-composition-src="compositions/timeline.html"
        data-start="4" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="prompt" data-composition-id="prompt" data-composition-src="compositions/prompt.html"
        data-start="7.5" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="slam" data-composition-id="slam" data-composition-src="compositions/slam.html"
        data-start="10.5" data-duration="1.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="12" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="15" data-track-index="4" data-volume="1"></audio>

      <div id="grain" style="z-index:50" data-composition-id="grain" data-composition-src="compositions/grain.html"
        data-start="0" data-duration="15" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

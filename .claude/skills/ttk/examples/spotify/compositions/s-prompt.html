<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #pm-wrap { transform-origin: 960px 560px; }
    #pm-bg { position: absolute; left: 260px; top: 300px; width: 1400px; height: 520px; background: rgba(9,11,10,0.9); opacity: 0; }
    .pm-lab { position: absolute; top: 322px; font-family: var(--font-mono); font-weight: 700; font-size: 22px; letter-spacing: 0.12em; opacity: 0; }
    #pm-l1 { left: 300px; color: #1ed760; } #pm-l2 { right: 300px; color: rgba(225,232,228,0.6); }
    #pm-txt { position: absolute; left: 310px; top: 400px; width: 1320px; font-family: var(--font-mono); font-weight: 500; font-size: 46px;
      line-height: 96px; color: #f1f3f2; white-space: pre; }
    #pm-txt span { opacity: 0; }
    #pm-txt .k { color: rgba(225,232,228,0.5); }
    #pm-txt .hl { background: #1ed760; color: #03160a; box-shadow: 0 0 18px rgba(30,215,96,0.55); }
  </style>
  <div id="root" data-composition-id="s-prompt" data-width="1080" data-height="1920">
    <div class="tk-scr" data-layout-ignore>
      <div id="pm-wrap" class="tk-full">
        <div id="pm-bg"></div>
        <div id="pm-box" class="tk-full"></div>
        <div id="pm-l1" class="pm-lab">• O QUE VOCÊ QUER OUVIR?</div>
        <div id="pm-l2" class="pm-lab">→ SPOTIFY</div>
        <div id="pm-txt"></div>
      </div>
      <div id="pm-fx" class="tk-full"></div>
    </div>
  </div>
  <script>
    (function () {
      var lines = ["algo pra dançar na cozinha às 2 da manhã,", "sem música triste e com muito grave"];
      var marks = ["dançar na cozinha", "2 da manhã", "muito grave"], keys = [];
      var X0 = 310, Y0 = 400, CW = 27.6, LH = 96;
      var full = lines.join("\n"), box = document.getElementById("pm-box"), fx = document.getElementById("pm-fx"), txt = document.getElementById("pm-txt");
      function ranges(words) { var r = []; words.forEach(function (w) { var i = full.indexOf(w); if (i >= 0) r.push([i, i + w.length]); }); return r; }
      var hl = ranges(marks), ky = ranges(keys), idx = [], pos = [], row = 0, col = 0;
      for (var i = 0; i < full.length; i++) {
        var c = full[i];
        if (c === "\n") { txt.appendChild(document.createTextNode("\n")); row++; col = 0; continue; }
        var s = document.createElement("span"); s.textContent = c; s.className = "pm-c" + i;
        hl.forEach(function (h) { if (i >= h[0] && i < h[1]) s.classList.add("hl"); });
        ky.forEach(function (h) { if (i >= h[0] && i < h[1]) s.classList.add("k"); });
        txt.appendChild(s); idx.push(i); pos.push([X0 + (col + 1) * CW, Y0 + row * LH + LH / 2]); col++;
      }
      var sp = TTK.spark(fx, "pm-sp", 26);
      var tl = gsap.timeline({ paused: true });
      // one line splits in two and becomes the box
      var top = TTK.drawLine(tl, box, [260, 560], [1660, 560], 0, 0.06, "power2.out", "hot");
      var bot = TTK.drawLine(tl, box, [260, 560], [1660, 560], 0, 0.06, "power2.out", "hot");
      tl.to(top, { y: -260, duration: 0.2, ease: "power3.out" }, 0.05);
      tl.to(bot, { y: 260, duration: 0.2, ease: "power3.out" }, 0.05);
      TTK.drawLine(tl, box, [260, 300], [260, 820], 0.2, 0.14, "power2.out", "dim");
      TTK.drawLine(tl, box, [1660, 300], [1660, 820], 0.2, 0.14, "power2.out", "dim");
      tl.fromTo("#pm-bg", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.15);
      tl.fromTo(".pm-lab", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.25);
      var T0 = 0.36, DT = 0.011;
      tl.set(sp, { x: X0, y: Y0 + LH / 2, opacity: 1, rotation: 0 }, T0 - 0.02);
      idx.forEach(function (ci, k) { var t = T0 + k * DT; tl.to(".pm-c" + ci, { opacity: 1, duration: 0.01 }, t); tl.set(sp, { x: pos[k][0], y: pos[k][1] }, t); });
      var tEnd = T0 + idx.length * DT;
      tl.to("#pm-l2", { color: "#1ed760", duration: 0.1 }, tEnd + 0.05);
      tl.set("#pm-l2", { textContent: "✓ PLAYLIST PRONTA" }, tEnd + 0.05);
      tl.to(sp, { opacity: 0, duration: 0.1 }, 1.9);
      // exit: the box squashes into a line
      tl.to("#pm-wrap", { scaleY: 0.02, duration: 0.14, ease: "power3.in" }, 1.98);
      tl.to("#pm-wrap", { opacity: 0, duration: 0.04 }, 2.12);
      window.__timelines["s-prompt"] = tl;
    })();
  </script>
</template>

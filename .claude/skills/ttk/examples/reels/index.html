<!doctype html>
<html lang="pt-BR" data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fundo","default":"#050505"},
    {"id":"color-ink","type":"color","label":"Texto","default":"#FFFFFF"},
    {"id":"color-accent","type":"color","label":"Destaque","default":"#ff0069"},
    {"id":"color-alt","type":"color","label":"Negação","default":"#fcaf45"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/ttk.js"></script>
    <style>
      /* LOOK (ttk / screen-on-desk): a phone shot of a monitor on a desk, green-lit slatted wall (Spotify green #ff0069),
         animation plays on the monitor (1920x1080 screen space). Protagonist = glowing ember spark that draws, writes, cuts.
         Display: Barlow Condensed 800 (ember letters). UI: JetBrains Mono. Captions: Inter. Negation accent #fcaf45. */
      @font-face { font-family: "Barlow Condensed"; src: url("assets/fonts/barlowc-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/inter-700.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jbmono-500.woff2") format("woff2"); font-weight: 100 900; }
      :root {
        --color-ground: #050505; --color-ink: #ffffff; --color-accent: #ff0069; --color-alt: #fcaf45;
        --font-display: "Barlow Condensed", sans-serif; --font-mono: "JetBrains Mono", monospace; --font-ui: "Inter", sans-serif;
        --fg: var(--color-ink); --brand: var(--color-accent); --font-body: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--color-ground); overflow: hidden; }
      #camera { position: absolute; inset: 0; }

      /* screen space: 1920x1080 mapped onto the monitor glass */
      .tk-scr { position: absolute; left: 20px; top: 548px; width: 1920px; height: 1080px; transform-origin: 0 0;
        transform: scale(0.541667); overflow: hidden; }
      .tk-full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .tk-c { position: absolute; left: 0; width: 1920px; text-align: center; white-space: nowrap; }
      .tk-big { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.01em; line-height: 1; }
      .tk-white { color: #f7f7f2; text-shadow: 0 0 18px rgba(255,255,255,0.45), 0 0 60px rgba(255,255,255,0.18); }
      .tk-ember { background: linear-gradient(180deg, #ffffff 0%, #fff1c9 16%, #ffc35a 34%, #ff7a3d 50%, #ff0069 70%, #a020c8 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 14px rgba(255,0,105,0.85)) drop-shadow(0 0 48px rgba(255,0,105,0.45)); }
      .tk-alt { color: var(--color-alt); text-shadow: 0 0 20px rgba(252,175,69,0.7), 0 0 60px rgba(252,175,69,0.35); }
      .tk-ch { display: inline-block; opacity: 0; }

      .tk-sp { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; z-index: 20; }
      .tk-sp-head { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
        background: radial-gradient(circle, #ffffff 0%, #ffedf4 22%, #ff66a5 42%, rgba(255,0,105,0.55) 58%, rgba(255,0,105,0) 72%);
        box-shadow: 0 0 30px 8px rgba(255,0,105,0.55), 0 0 90px 20px rgba(255,0,105,0.25); }
      .tk-sp-tail { position: absolute; left: -300px; top: -6px; width: 300px; height: 12px; border-radius: 12px; transform-origin: 100% 50%;
        background: linear-gradient(90deg, rgba(255,0,105,0) 0%, rgba(255,0,105,0.35) 55%, #ffbfda 100%); filter: blur(2px); }
      .tk-line { position: absolute; height: 4px; border-radius: 4px; transform-origin: 0 50%; background: #ff73ac;
        box-shadow: 0 0 10px rgba(255,0,105,0.9), 0 0 28px rgba(255,0,105,0.5); }
      .tk-line.dim { background: rgba(255,115,172,0.55); box-shadow: 0 0 8px rgba(255,0,105,0.5); height: 3px; }
      .tk-line.hot { background: #fff0f6; height: 7px; box-shadow: 0 0 14px #fff, 0 0 34px #ff0069, 0 0 90px rgba(255,0,105,0.8); }
      .tk-pt { position: absolute; left: 0; top: 0; border-radius: 50%; opacity: 0; margin: -5px 0 0 -5px;
        background: radial-gradient(circle, #fff 0%, #ff80b4 45%, rgba(255,0,105,0) 75%); }
      .tk-pt.alt { background: radial-gradient(circle, #fff 0%, #fdd399 45%, rgba(252,175,69,0) 75%); }
      .tk-kw { display: inline-block; padding: 0 6px; border-radius: 3px; opacity: 0; color: #f2f2f2; background-color: rgba(255,0,105,0); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-fps="60" data-width="1080" data-height="1920">
      <div id="camera">
        <div id="env" data-composition-id="env" data-composition-src="compositions/env.html"
          data-start="0" data-duration="16" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

        <div id="r-hook" style="z-index:2" data-composition-id="r-hook" data-composition-src="compositions/r-hook.html"
          data-start="0" data-duration="1.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="r-flow" style="z-index:2" data-composition-id="r-flow" data-composition-src="compositions/r-flow.html"
          data-start="1.8" data-duration="2.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="r-prompt" style="z-index:2" data-composition-id="r-prompt" data-composition-src="compositions/r-prompt.html"
          data-start="3.8" data-duration="2.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="r-slam" style="z-index:2" data-composition-id="r-slam" data-composition-src="compositions/r-slam.html"
          data-start="6.0" data-duration="1.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="r-panel" style="z-index:2" data-composition-id="r-panel" data-composition-src="compositions/r-panel.html"
          data-start="7.6" data-duration="1.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="r-write" style="z-index:2" data-composition-id="r-write" data-composition-src="compositions/r-write.html"
          data-start="9.4" data-duration="1.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="r-loop" style="z-index:2" data-composition-id="r-loop" data-composition-src="compositions/r-loop.html"
          data-start="11.2" data-duration="1.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="r-final" style="z-index:2" data-composition-id="r-final" data-composition-src="compositions/r-final.html"
          data-start="13.0" data-duration="3.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="caps" style="z-index:3" data-composition-id="caps" data-composition-src="compositions/caps.html"
          data-start="0" data-duration="16" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="glass" style="z-index:4" data-composition-id="glass" data-composition-src="compositions/glass.html"
          data-start="0" data-duration="16" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      </div>

      <div id="ui" style="z-index:40" data-composition-id="ui" data-composition-src="compositions/ui.html"
        data-start="0" data-duration="16" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="grain" style="z-index:50" data-composition-id="grain" data-composition-src="compositions/grain.html"
        data-start="0" data-duration="16" data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <audio id="music" class="clip" src="assets/mix.wav" data-start="0" data-duration="16" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // handheld phone camera on everything inside #camera; kicks = [time, strength] on impacts
      TTK.camera(tl, "#camera", 16, [[0.52, 0.035], [2.78, 0.025], [3.05, 0.03], [6.74, 0.045], [8.89, 0.03], [13.34, 0.05]], 20);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
